spring.application.name=order-service
server.port=8082
server.servlet.context-path=/order-service
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/orderdb
spring.datasource.username=root
spring.datasource.password=Root@123$
spring.jpa.hibernate.ddl-auto=none

inventory.url=http://localhost:8083/inventoryservice

#Kafka Properties
spring.kafka.bootstrap-servers=localhost:9092,localhost:9093
auto.create.topics.enable=true
spring.kafka.template.default-topic=product-order-topic
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
#spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
#spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.schema.registry.url=http://localhost:8085
spring.kafka.consumer.properties.spring.json.trusted.packages=*

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

management.endpoints.web.exposure.include=health, info, metrics, prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=order-service

management.tracing.sampling.probability=1.0

